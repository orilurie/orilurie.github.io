<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>צלילי זירה</title>
<style>body{font-family:system-ui,sans-serif;background:#121826;color:#fff;margin:0 auto;padding:16px;max-width:560px}h1{font-size:1.3rem}h2{font-size:1rem;margin:16px 0 6px}audio{display:block;width:100%;margin:4px 0}
p{opacity:.75;font-size:.85rem}a{color:#ff8a3d}.gun{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;border:2px solid transparent}.gun audio{flex:1}
.gun.on{border-color:#ff8a3d;background:rgba(255,138,61,.12)}.gun button{background:#ff8a3d;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:.95rem}.gun.on button{background:#3ccf7a}</style></head><body>
<h1>🔊 הצלילים של זירה</h1>
<h2>🔫 בחרו צליל יריה</h2><p>שמעו את כולם ולחצו "בחר" על זה שאהבתם – המשחק ישתמש בו במכשיר הזה. (ודאו שהטלפון לא על שקט.)</p>
<div class="gun" data-n="1"><b>1</b><audio controls preload="none" src="sounds/candidates/gun1.mp3"></audio><button onclick="pick(1)">בחר</button></div><div class="gun" data-n="2"><b>2</b><audio controls preload="none" src="sounds/candidates/gun2.mp3"></audio><button onclick="pick(2)">בחר</button></div><div class="gun" data-n="3"><b>3</b><audio controls preload="none" src="sounds/candidates/gun3.mp3"></audio><button onclick="pick(3)">בחר</button></div><div class="gun" data-n="4"><b>4</b><audio controls preload="none" src="sounds/candidates/gun4.mp3"></audio><button onclick="pick(4)">בחר</button></div><div class="gun" data-n="5"><b>5</b><audio controls preload="none" src="sounds/candidates/gun5.mp3"></audio><button onclick="pick(5)">בחר</button></div><div class="gun" data-n="6"><b>6</b><audio controls preload="none" src="sounds/candidates/gun6.mp3"></audio><button onclick="pick(6)">בחר</button></div><div class="gun" data-n="7"><b>7</b><audio controls preload="none" src="sounds/candidates/gun7.mp3"></audio><button onclick="pick(7)">בחר</button></div><div class="gun" data-n="8"><b>8</b><audio controls preload="none" src="sounds/candidates/gun8.mp3"></audio><button onclick="pick(8)">בחר</button></div>
<h2 style="margin-top:24px">שאר הצלילים</h2><section><h2>✊ פגעת במישהו</h2><audio controls preload="none" src="sounds/hit1.mp3"></audio><audio controls preload="none" src="sounds/hit2.mp3"></audio><audio controls preload="none" src="sounds/hit3.mp3"></audio></section><section><h2>💥 פגעו בך</h2><audio controls preload="none" src="sounds/hurt1.mp3"></audio><audio controls preload="none" src="sounds/hurt2.mp3"></audio></section><section><h2>🧱 כדור בקיר</h2><audio controls preload="none" src="sounds/wall1.mp3"></audio><audio controls preload="none" src="sounds/wall2.mp3"></audio><audio controls preload="none" src="sounds/wall3.mp3"></audio></section><section><h2>👣 צעדים</h2><audio controls preload="none" src="sounds/step1.mp3"></audio><audio controls preload="none" src="sounds/step2.mp3"></audio><audio controls preload="none" src="sounds/step3.mp3"></audio><audio controls preload="none" src="sounds/step4.mp3"></audio><audio controls preload="none" src="sounds/step5.mp3"></audio></section><section><h2>💀 נפסל/ה</h2><audio controls preload="none" src="sounds/die.mp3"></audio></section><section><h2>🔔 הפלת מישהו</h2><audio controls preload="none" src="sounds/kill.mp3"></audio></section><section><h2>🎁 איסוף בונוס</h2><audio controls preload="none" src="sounds/pickup.mp3"></audio></section><section><h2>🛡️ מגן כניסה</h2><audio controls preload="none" src="sounds/block.mp3"></audio></section><section><h2>⏱️ ספירה לאחור</h2><audio controls preload="none" src="sounds/count.mp3"></audio></section><section><h2>🚦 התחלה</h2><audio controls preload="none" src="sounds/go.mp3"></audio></section>
<p><a href="arena.html">→ לזירה</a></p>
<script>
function cur(){try{return Number(localStorage.getItem('arena-gun'))||3}catch(e){return 3}}
function mark(){document.querySelectorAll('.gun').forEach(g=>{const on=Number(g.dataset.n)===cur();g.classList.toggle('on',on);g.querySelector('button').textContent=on?'✓ נבחר':'בחר'})}
function pick(n){try{localStorage.setItem('arena-gun',n)}catch(e){}mark()}
mark();
</script></body></html>
