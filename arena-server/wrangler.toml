# Game server for "זירה" (the real-time arena shooter in game-night/arena.html).
# Deploy: CLOUDFLARE_API_TOKEN=... npx wrangler deploy   (from this folder)
name = "arena"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "MM"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Matchmaker"]

# המבוך (the dungeon game): one Durable Object per run
[[durable_objects.bindings]]
name = "DUNGEON"
class_name = "Dungeon"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Dungeon"]
