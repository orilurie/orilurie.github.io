# Game server for "זירה" (the real-time arena shooter in hathatul/arena.html).
# Deploy: CLOUDFLARE_API_TOKEN=... npx wrangler deploy   (from this folder)
name = "arena"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "MM"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Matchmaker"]
